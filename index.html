<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="군산 성원상떼빌 - 맞춤 상담 예약 및 특별 혜택">
    <title>군산 성원상떼빌 | 맞춤 혜택 상담 예약</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ofiicial-model-house.vercel.app">
    <meta property="og:title" content="군산지곡 성원상떼빌 더프라임">
    <meta property="og:description" content="군산 성원상떼빌 - 맞춤 상담 예약 및 특별 혜택">
    <meta property="og:image" content="https://ofiicial-model-house.vercel.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://ofiicial-model-house.vercel.app">
    <meta property="twitter:title" content="군산지곡 성원상떼빌 더프라임">
    <meta property="twitter:description" content="군산 성원상떼빌 - 맞춤 상담 예약 및 특별 혜택">
    <meta property="twitter:image" content="https://ofiicial-model-house.vercel.app/og-image.png">

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
</head>
<body>
    <!-- 스티키 CTA 버튼 (모바일 하단 고정) -->
    <div class="sticky-cta" id="stickyCta">
        <button class="sticky-cta-btn" onclick="scrollToForm()">
            상담 예약하기
        </button>
    </div>

    <!-- 카카오톡 상담 플로팅 버튼 -->
    <a href="https://open.kakao.com/o/sYpCdW6h" target="_blank" rel="noopener noreferrer" class="kakao-floating-btn">
        <img src="./public/product_kakaotalkconsult_logo_img.png" alt="카카오톡 상담하기">
    </a>

    <div class="container">
        <!-- 히어로 섹션 (디자이너 제작 이미지 영역) -->
        <section class="hero-section">
            <img src="./public/01.png" alt="군산 성원상떼빌 히어로 이미지" class="hero-image">
        </section>

        <!-- 바디 이미지 섹션 (디자이너 제작 이미지 영역) -->
        <section class="body-images-section">
            <img src="./public/02-1.png" alt="군산 성원상떼빌 혜택 안내" class="body-image">
        </section>

        <!-- 리드폼 섹션 -->
        <section class="lead-form-section" id="leadForm">
            <div class="lead-form-container">
                <div class="form-header">
                    <h2 class="form-title">빠른 상담 예약</h2>
                    <p class="form-description">원하시는 시간에 맞춰 담당자가 연락드립니다</p>
                </div>

                <form class="lead-form" id="consultationForm">
                    <!-- 연령대 선택 -->
                    <div class="form-group">
                        <label class="form-label">연령대 선택 (혜택 안내용)</label>
                        <div class="age-group-buttons">
                            <button type="button" class="age-btn" data-age="20-30">20~30대</button>
                            <button type="button" class="age-btn" data-age="40-50">40~50대</button>
                            <button type="button" class="age-btn" data-age="60+">60대 이상</button>
                        </div>
                        <input type="hidden" id="ageGroup" name="ageGroup" required>
                        <span class="error-message" id="ageError"></span>
                    </div>

                    <!-- 성함 -->
                    <div class="form-group">
                        <label class="form-label" for="name">성함</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            class="form-input"
                            placeholder="홍길동"
                            minlength="2"
                            required
                        >
                        <span class="error-message" id="nameError"></span>
                    </div>

                    <!-- 연락처 -->
                    <div class="form-group">
                        <label class="form-label" for="phone">연락처 (숫자만 입력해주세요)</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            class="form-input"
                            placeholder="010-1234-5678"
                            pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}"
                            required
                        >
                        <span class="error-message" id="phoneError"></span>
                    </div>

                    <!-- 통화 가능 시간 -->
                    <div class="form-group">
                        <label class="form-label">통화 가능 시간</label>
                        <div class="time-options">
                            <label class="radio-option">
                                <input type="radio" name="callTime" value="가장 빠른 안내 (상관없음)" checked>
                                <span class="radio-label">✓ 가장 빠른 안내 (상관없음)</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="callTime" value="오전 9-12시">
                                <span class="radio-label">오전 9-12시</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="callTime" value="오후 12-6시">
                                <span class="radio-label">오후 12-6시</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="callTime" value="저녁 6시 이후">
                                <span class="radio-label">저녁 6시 이후</span>
                            </label>
                        </div>
                    </div>

                    <!-- 개인정보 동의 체크박스 -->
                    <div class="privacy-checkbox-group">
                        <label class="privacy-checkbox-label">
                            <input type="checkbox" id="privacyAgree" name="privacyAgree" class="privacy-checkbox" required>
                            <span class="checkbox-text">개인정보 수집 및 이용에 동의합니다.</span>
                        </label>
                        <p class="privacy-detail-text">입력하신 정보(이름, 연락처, 연령대 등)는 군산 지곡 성원상떼빌 잔여세대 조회 및 상담, 모델하우스 방문 예약을 위해서만 활용됩니다. 수집된 정보는 분양/임대 일정 종료 후 안전하게 파기됩니다. 이에 동의하십니까?</p>
                        <span class="error-message" id="privacyError"></span>
                    </div>

                    <!-- 제출 버튼 -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">상담 예약하기</span>
                        <span class="loading-spinner" style="display: none;">
                            <span class="spinner"></span> 제출 중...
                        </span>
                        <span class="success-check" style="display: none;">
                            ✓ 신청 완료!
                        </span>
                    </button>
                </form>
            </div>
        </section>

        <!-- 푸터 -->
        <footer class="footer">
            <p>© 2026 군산 성원상떼빌 모델하우스.</p>
            <p class="footer-contact">문의: 010-7537-0871 | 평일 09:00 - 18:00</p>
        </footer>
    </div>

    <!-- 성공 모달 -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-icon">
                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="64" height="64" rx="8" fill="#5879ea"/>
                        <path d="M20 32L28 40L44 24" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h3>상담 신청이 완료되었습니다!</h3>
            </div>
            <div class="modal-body">
                <p>빠른 시간 내에 연락드리겠습니다.</p>
            </div>
            <button class="modal-close-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
